spring:
  config.import: optional:file:.env[.properties],optional:file:../.env[.properties]
  application.name: calendar-service
  datasource:
    url: jdbc:postgresql://localhost:5432/smart_meeting_scheduler_it?currentSchema=calendar_service
    username: ${DB_USERNAME:scheduler}
    password: ${DB_PASSWORD:}
    driver-class-name: org.postgresql.Driver
  jpa:
    open-in-view: false
    hibernate.ddl-auto: validate
    properties.hibernate.jdbc.time_zone: UTC
  flyway:
    enabled: true
    schemas: calendar_service
    default-schema: calendar_service
    create-schemas: true
  jackson.time-zone: UTC
server.port: ${CALENDAR_SERVICE_PORT:8082}
server.error.include-message: never
springdoc.swagger-ui.path: /swagger-ui.html
user-service.url: ${USER_SERVICE_URL:http://localhost:8081}
outbound.http.connect-timeout: ${OUTBOUND_HTTP_CONNECT_TIMEOUT:2s}
outbound.http.read-timeout: ${OUTBOUND_HTTP_READ_TIMEOUT:5s}
