spring:
  config.import: optional:file:.env[.properties],optional:file:../.env[.properties]
  application.name: user-service
  datasource:
    # url: ${USER_DB_URL:jdbc:postgresql://localhost:5432/smart_meeting_scheduler?currentSchema=user_service}
    # username: ${USER_DB_USERNAME:${DB_USERNAME:scheduler}}
    # password: ${USER_DB_PASSWORD:${DB_PASSWORD:}}
    url: jdbc:postgresql://localhost:5432/smart_meeting_scheduler_it?currentSchema=user_service
    username: ${DB_USERNAME:scheduler}
    password: ${DB_PASSWORD:}
    driver-class-name: org.postgresql.Driver
  jpa:
    open-in-view: false
    hibernate.ddl-auto: validate
    properties.hibernate.jdbc.time_zone: UTC
  flyway:
    enabled: true
    schemas: user_service
    default-schema: user_service
    create-schemas: true
  jackson.time-zone: UTC
server.port: ${USER_SERVICE_PORT:8081}
server.error.include-message: never
springdoc.swagger-ui.path: /swagger-ui.html
